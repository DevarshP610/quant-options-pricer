name: QuantDesk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-quant-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./1-python-quant-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest mathematical verification suite
        run: pytest -v

  build-csharp-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./2-csharp-gateway-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build C# Gateway
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release